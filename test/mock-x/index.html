<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Mock X</title>
    <style>
      body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; color: #0f1419; }
      body.dark { background: #000; color: #e7e9ea; }
      nav { position: fixed; top: 0; left: 0; width: 220px; padding: 16px; }
      [data-testid="primaryColumn"] { margin-left: 240px; width: 600px; border-left: 1px solid #eee; border-right: 1px solid #eee; min-height: 100vh; }
      .list { position: relative; }
      [data-testid="UserCell"] { position: absolute; left: 0; right: 0; box-sizing: border-box; padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: center; }
      [data-testid="UserCell"] a { color: inherit; text-decoration: none; }
      [data-testid="userFollowIndicator"] { font-size: 12px; background: #eee; padding: 1px 4px; border-radius: 4px; color: #536471; }
      [role="alertdialog"] { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.4); }
      .spinner { padding: 20px; text-align: center; }
    </style>
